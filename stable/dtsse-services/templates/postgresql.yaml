{{- if .Values.devPostgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
type: Opaque
stringData:
  password: {{ .Values.devPostgresql.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-postgresql
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgresql
          image: {{ .Values.devPostgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          env:
            - name: POSTGRES_DB
              value: {{ .Values.devPostgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.devPostgresql.username | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgresql/password
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.devPostgresql.username | quote }}, "-d", {{ .Values.devPostgresql.database | quote }}]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: password
              mountPath: /etc/postgresql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: password
          secret:
            secretName: {{ .Release.Name }}-postgresql
{{- end }}
