java:
  applicationPort: 4550
  image: 'hmctsprod.azurecr.io/deed-poll/api:latest'
  # The host `deed-poll-admin` already expects to reach this service on — its web chart's
  # `DEED_POLL_API_URL` spells out the same name. Cluster-internal, not a public ingress.
  ingressHost: deed-poll-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
  # Use the namespace service account federated to `deed-poll-{env}-mi`. The matching identity,
  # federated credential and service-account annotation are owned by cnp-flux-config.
  useWorkloadIdentity: true
  saEnabled: true
  # The `deed-poll-{env}` vault, created by the shared root in `hmcts/deed-poll-infra` and shared with
  # `deed-poll-admin` and `deed-poll-web`. It must have applied before this chart can deploy: nothing
  # enforces that ordering mechanically, so a missing secret here is a missing apply there, not a chart
  # bug. Mounted at `/mnt/secrets/deed-poll/`, which is what `spring.config.import`'s configtree and
  # `lib/applicationinsights.json` both read.
  #
  # Every environment this chart deploys to has every secret below. deed-poll-infra creates the IDAM client,
  # system user and S2S secrets in aat, demo, ithc and prod (api-identity.tf); the S2S one is copied from
  # `microservicekey-deed-poll-api` in `s2s-{env}`. Configuration that differs per environment lives in
  # cnp-flux-config, which overrides only what it must. Prod's `notify-api-key` is a placeholder until a prod Notify
  # service exists (deed-poll-infra#40). A Flux `keyVaults` override replaces the list, so it has to restate every
  # secret it keeps.
  keyVaults:
    deed-poll:
      secrets:
        # No alias, so it stays a file under the mount rather than becoming an environment variable:
        # the Application Insights agent reads it through `lib/applicationinsights.json`, and the
        # configtree import turns the same file into the `app-insights-connection-string` property.
        - name: app-insights-connection-string
        # Four separate variables, not `postgres-url`. That secret exists for the Node services, which
        # want a composed URL; `application.yaml` composes its own JDBC URL from the parts. The shared
        # root provisions both forms precisely because the two runtimes want different shapes.
        - name: postgres-host
          alias: DB_HOST
        - name: postgres-port
          alias: DB_PORT
        - name: postgres-user
          alias: DB_USER_NAME
        - name: postgres-password
          alias: DB_PASSWORD
        # The non-prod Notify service's team-and-guest-list key, written by hand to `deed-poll-aat` and
        # `deed-poll-demo` on 2026-10-08 — no Terraform owns it, because Notify issues it and never shows it twice.
        # It delivers to guest-listed inboxes only. Not the Test key: that answers a realistic success and sends
        # nothing, so a send through it looks like a working feature. A vault without it fails this deploy.
        - name: notify-api-key
          alias: NOTIFY_API_KEY
        # The api's own IDAM client and the CCD system user it signs in as (CCD linking and CDAM), and its outbound
        # S2S key for data-store, CDAM and RAS.
        - name: api-idam-client-secret
          alias: IDAM_CLIENT_SECRET
        - name: api-idam-system-username
          alias: DEED_POLL_SYSTEM_USERNAME
        - name: api-idam-system-password
          alias: DEED_POLL_SYSTEM_PASSWORD
        - name: api-s2s-secret
          alias: DEED_POLL_API_S2S_SECRET
        # The Docmosis Tornado access key DOCX previews convert with: copied from em-stitching-{env} in aat and demo
        # (deed-poll-infra docmosis.tf), by hand in ithc, and a placeholder in prod, where DOCMOSIS_URL below is empty.
        - name: docmosis-access-key
          alias: DOCMOSIS_ACCESS_KEY
  environment:
    ENVIRONMENT_NAME: "{{ .Values.global.environment }}"
    # The shared Docmosis Tornado service DOCX previews convert through (the base: /rs/convert is appended), the
    # in-cluster address em-stitching-api uses. **Empty in prod**, so prod's converter is unconfigured whatever the
    # vault's placeholder key holds, and a DOCX preview there answers 503 while its download works. Prod's would be
    # https://docmosis.platform.hmcts.net, with its real key written over the placeholder, when prod previews go on.
    DOCMOSIS_URL: '{{ if ne .Values.global.environment `prod` }}https://docmosis.{{ .Values.global.environment }}.platform.hmcts.net{{ end }}'
    # Off until CCD/CDAM onboarding, staff read permissions and the 03b/03c rollout prerequisites are complete in an
    # environment. The CCD identifiers and CDAM URL below being real is not that onboarding.
    #
    # Prod is the exception, because DocumentStoreEnvironmentGuard refuses the filesystem store there and the api
    # would not start. CdamOnboarding checks only this configuration, so prod starts on cdam. But its uploads and
    # generated deeds fail until prod's CCD is onboarded and its records linked. That is acceptable only while
    # prod is dark, with no sign-in and no records. The tpl literals are in backticks for the reason given above
    # the Notify ids below.
    DOCUMENT_STORE: '{{ if eq .Values.global.environment `prod` }}cdam{{ else }}filesystem{{ end }}'
    # Every non-prod environment follows these patterns, and the `.internal` hosts follow them in prod too. Prod
    # overrides the issuer and IDAM's API, which carry no environment segment there. The ForgeRock issuer that
    # password-grant tokens carry is named differently in each environment (`idam-aat2`, `idam-ithc`, `idam-prod2`),
    # so `IDAM_API_ADDITIONAL_ISSUERS` is set in each one's Flux patch instead.
    IDAM_API_ISSUER_URL: https://hmcts-access.{{ .Values.global.environment }}.platform.hmcts.net/o
    IDAM_API_URL: https://idam-api.{{ .Values.global.environment }}.platform.hmcts.net
    IDAM_API_AUDIENCES: deed-poll-admin,deed-poll-api
    IDAM_CLIENT_ID: deed-poll-api
    IDAM_CLIENT_REDIRECT_URI: http://deed-poll-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal/receiver
    IDAM_S2S_AUTH_URL: http://rpe-service-auth-provider-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
    # The confirmed CCD identifiers. The sweep that uses them stays off (application.yaml) unless an environment's
    # Flux switches it on after its CCD smoke checks.
    CCD_JURISDICTION_ID: DEEDPOLL
    CCD_CASE_TYPE_ID: DEEDPOLL
    # The IDAM role the system user holds, which the definition maps onto DEED_POLL_SYSTEM.
    CCD_SYSTEM_ROLE: deed-poll-system-update
    CCD_DATA_STORE_URL: http://ccd-data-store-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
    CASE_DOCUMENT_AM_URL: http://ccd-case-document-am-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
    DOCUMENT_URL_BASE: http://dm-store-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
    # The one shared database for the product — `deed-poll-api` owns the `public` and `ccd` schemas,
    # `deed-poll-admin` owns `session` in the same database. Not a secret: it is a name, and the shared
    # root does not write one. Stated explicitly because `application.yaml` defaults it to `deedpoll`
    # for the docker-compose database, which is a *different* name: inheriting that default would have
    # Hibernate validate against a database that does not exist.
    DB_NAME: deed-poll
    # Azure Postgres flexible server refuses a cleartext connection, and the JDBC driver does not
    # negotiate TLS by default, so without this every connection fails at startup. `gssEncMode=disable`
    # stops the driver attempting GSS first, which Azure answers slowly rather than refusing.
    DB_OPTIONS: "?sslmode=require&gssEncMode=disable"
    # The ③ Application Rejected Notify template, authored 2026-09-23 on the **non-prod** Notify service.
    # Not a secret: it identifies a template, not a credential, so it is configuration rather than a vault
    # entry — `application.yaml` defaults it to `DEED_POLL_PLACEHOLDER` so one grep still lists every external
    # identifier the service is waiting on, and this is the override that makes a real send possible.
    #
    # **CORRECTED 2026-09-25, because the claim this comment used to make is false and it is the reason these
    # ids are safe to set — so getting it wrong matters.** It said "nothing sends until `NOTIFY_API_KEY` exists:
    # `NotifyProperties.isProvisioned` gates the drain". It does not. `isProvisioned` reads the template id and,
    # for a reply-inviting template, `emailReplyToId` — **it never looks at the API key**. So a real template id
    # with no key does not "send nothing": availability reports the template as sendable, the Email tab offers
    # it, the send enqueues, and the **drain fails terminally** with
    # `TECHNICAL: IllegalArgumentException: Empty key`. Measured locally on 2026-09-24 against a real api.
    #
    # The consequence is **visible rather than silent**, which is the one mercy: the transition into `Failed`
    # writes a case note ("… could not be sent. See the Emails tab for the reason") beside the sent note, and
    # the Emails tab shows the row `Failed` with that reason. A caseworker is told. The applicant still is not.
    #
    # **The case email ids below are live in AAT the moment they are set.** Gazette additionally requires
    # GAZETTE_ENABLED=true and its saved recipient. Until 2026-10-08 AAT had no Notify key, and
    # every send of these templates failed that way. The key is now `notify-api-key` under `keyVaults` above.
    #
    # **These are the non-prod ids, and prod gets none of them.** There is no prod Notify service yet, so each
    # value below renders `DEED_POLL_PLACEHOLDER` (or empty) when `global.environment` is `prod`: every template
    # then reads unprovisioned, nothing is offered and nothing enqueues. Inheriting them would fail safe rather
    # than misdeliver — a prod Live key cannot use another service's template, so Notify answers 403 — but it
    # would still be wrong. The conditional is a string the java chart renders through `tpl`, so this file stays
    # plain YAML for `DeploymentChartConformanceTest`; its literals are in backticks because the chart quotes the
    # value before rendering it, and a double quote would be escaped out of the template. When prod Notify
    # exists, put prod's ids in the `prod` branch here rather than in Flux.
    #
    # None of these is a secret: each identifies a template or a reply-to address the recipient reads on the
    # email anyway, so they are configuration rather than vault entries. `application.yaml` defaults every one to
    # `DEED_POLL_PLACEHOLDER` (or empty) so one grep still lists every external identifier the service awaits.
    #
    # ③ Application Rejected, authored 2026-09-23 on the non-prod service.
    NOTIFY_TEMPLATE_APPLICATION_REJECTED: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}b2cb5754-591d-40c0-b961-b2823a5792eb{{ end }}'
    # ⑤ Chase missing documents, authored 2026-09-24 and verified by reading it back through
    # `GET /v2/template/{id}`: the five placeholders matched character-for-character. notify-6 builds against it.
    NOTIFY_TEMPLATE_CHASE_MISSING_DOCUMENTS: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}a67e7dd1-0f8c-4366-a1de-ca5fbc24ec98{{ end }}'
    # The registered reply-to for `KBDEEDSPOLL@justice.gov.uk`, verified in Notify 2026-09-24. **Not a template
    # id** — it is the id of the address, and it is what `isProvisioned` additionally requires of any template
    # with `invitesReply = true`. **One value for the whole service**, so it serves ⑤ and ④ alike.
    #
    # A blank one is the dangerous case rather than a wrong one: Notify **silently drops** it and sends from
    # no-reply, so ⑤'s "reply to this email" sentence would point nowhere while the email still went out. An
    # unrecognised id is a loud 400 instead. That asymmetry is why `isProvisioned` gates on it.
    NOTIFY_EMAIL_REPLY_TO_ID: '{{ if ne .Values.global.environment `prod` }}aabceef1-63e4-4414-9554-a24b0be967d7{{ end }}'
    # ④ Request confirmation to proceed, authored 2026-09-26 (version 1) and verified by reading it back through
    # `GET /v2/template/{id}`: all ten placeholders match `RequestConfirmationToProceedPersonalisation`. Two
    # previews confirmed that `is_minor` works as a JSON boolean ("your details" for an adult, "your child's
    # details" for a minor) and that each case gets only its own refund paragraph. It invites a reply, so it
    # needs the reply-to above, which is already set.
    NOTIFY_TEMPLATE_REQUEST_CONFIRMATION_TO_PROCEED: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}a58c5a8c-7727-4d1f-af08-4953d9f3d33e{{ end }}'
    # ① and ② Forms for completion, adult and minor, authored 2026-09-25 and 2026-09-26; ② carries LOC024 (v9).
    # Both invite a reply and both carry the generated deed, so `isProvisioned` also needs the reply-to above
    # and the retention below — without either they read unprovisioned rather than failing at the drain.
    NOTIFY_TEMPLATE_FORMS_FOR_COMPLETION_ADULT: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}91a89945-bfa6-4423-86f5-be6f1c782aa5{{ end }}'
    NOTIFY_TEMPLATE_FORMS_FOR_COMPLETION_MINOR: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}a2500c11-b282-48c3-a196-9f5700d13c91{{ end }}'
    # Non-prod Gazette templates supplied by Steve and read back from Notify on 2026-10-09 (all version 1).
    # Names, subject, body and exact placeholders match the agreed wording; download delivery still needs
    # controlled acceptance testing. Prod renders placeholders until its own service's ids exist (see above).
    # Keep new previews/sends disabled until the rollout checks in docs/GAZETTE-RECOVERY.md are complete.
    GAZETTE_ENABLED: "false"
    NOTIFY_TEMPLATE_GAZETTE_ADULT: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}1ab4503a-1c1b-4db1-b805-b188b1923e0b{{ end }}'
    NOTIFY_TEMPLATE_GAZETTE_MINOR: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}823518db-0064-4df8-8ddd-2f52bd52e997{{ end }}'
    NOTIFY_TEMPLATE_GAZETTE_MIXED: '{{ if eq .Values.global.environment `prod` }}DEED_POLL_PLACEHOLDER{{ else }}d956464f-8fe1-4eb2-9f02-4a309a14636e{{ end }}'
    # The Master emails (plans D3 and F1): one for each send from the referral queue, and the reminder, sent to a
    # Master rather than an applicant. **Nobody has created either template yet**, so every environment is
    # unprovisioned, which reads as a visible skip: each send and reminder writes its email row `Skipped`, sending
    # nothing and building no backlog. When a template exists, put its id here per environment (prod in a `prod`
    # branch, as above) and bump the chart. Suggested template text: docs/MASTER-EMAILS.md.
    NOTIFY_TEMPLATE_MASTER_REFERRAL_SENT: DEED_POLL_PLACEHOLDER
    NOTIFY_TEMPLATE_MASTER_REFERRAL_REMINDER: DEED_POLL_PLACEHOLDER
    # The admin app's public host, which the Master emails link My referrals under (`/judicial/referrals/mine`). The
    # same shape as deed-poll-admin's `ingressHost` (`deed-poll-admin.{env}.platform.hmcts.net`, and
    # `deed-poll-admin.platform.hmcts.net` in prod through cnp-flux-config). Start-up refuses a provisioned Master
    # template without it.
    ADMIN_BASE_URL: '{{ if eq .Values.global.environment `prod` }}https://deed-poll-admin.platform.hmcts.net{{ else }}https://deed-poll-admin.{{ .Values.global.environment }}.platform.hmcts.net{{ end }}'
    # AM as a second source of staff and judicial roles, off until CRD/JRD profiles exist. Enabling it in AAT also
    # needs RAS to admit deed_poll_api's S2S name, and flux's aat.yaml (which already mounts the S2S secret) to set
    # ROLE_ASSIGNMENT_URL, ROLE_ASSIGNMENT_GAZETTE_SKILL and this. A RAS failure falls back to the IDAM roles,
    # never to more.
    ROLE_ASSIGNMENT_ENABLED: "false"
    # Per-identity budgets on search, email and upload (RateLimitFilter). `observe` logs what `enforce` would refuse
    # and refuses nothing; switch to `enforce` per environment, AAT first, once the limits are tuned.
    RATE_LIMIT_MODE: observe
    # **A test value, chosen 2026-10-08 for AAT, NOT the business's decision.** How long an applicant's deed stays
    # downloadable is theirs to set (`application.yaml` deliberately has no default for that reason), and this
    # must be decided before prod sets one; until then prod renders it empty, which `isProvisioned` reads as
    # unconfigured for the document-carrying templates. 26 weeks leaves a tester ample time to follow a link.
    NOTIFY_DOCUMENT_RETENTION_WEEKS: '{{ if ne .Values.global.environment `prod` }}26{{ end }}'
