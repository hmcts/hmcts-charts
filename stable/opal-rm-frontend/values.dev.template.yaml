nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  keyVaults:
    opal:
      secrets:
        - app-insights-connection-string
        - managed-redis-connection-string
        - name: launch-darkly-client-id-dev
          alias: launch-darkly-client-id
  environment:
    OPAL_MAINTENANCE_SERVICE_API_URL: ${DEV_OPAL_MAINTENANCE_SERVICE_URL}
    OPAL_USER_SERVICE_API_URL: "https://opal-user-service.staging.platform.hmcts.net/"
    FRONTEND_HOSTNAME: https://${SERVICE_FQDN}
    FEATURES_LAUNCH_DARKLY_ENABLED: true
    FEATURES_SSO_ENABLED: false
    FEATURES_APP_INSIGHTS_ENABLED: false
    FEATURES_IP_LOGGING_ENABLED: true
    SESSION_PREFIX: "opal-rm-frontend-session"
opal-maintenance-service:
  enabled: ${DEV_ENABLE_OPAL_MAINTENANCE_SERVICE}
  java:
    releaseNameOverride: ${SERVICE_NAME}-maintenance-service
    image: 'hmctsprod.azurecr.io/opal/maintenance-service:${DEV_OPAL_MAINTENANCE_SERVICE_IMAGE_SUFFIX}'
    ingressHost: "opal-rm-frontend-pr-${CHANGE_ID}-maintenance-service.dev.platform.hmcts.net"
    imagePullPolicy: Always
    devmemoryRequests: "1Gi"
    devcpuRequests: "250m"
    devmemoryLimits: "2Gi"
    devcpuLimits: "2500m"
    secrets:
      SERVICEBUS_SHARED_ACCESS_KEY:
        secretRef: opal-sb-dev
        key: primaryKey
      SERVICEBUS_CONNECTION_STRING:
        secretRef: opal-sb-dev
        key: connectionString
    global:
      enableKeyVaults: true
    keyVaults:
      opal:
        secrets:
          - name: app-insights-connection-string
            alias: app-insights-connection-string
          - name: AzureADTenantId
            alias: AAD_TENANT_ID
          - name: AzureADClientId
            alias: AAD_CLIENT_ID
          - name: AzureADClientSecret
            alias: AAD_CLIENT_SECRET
    environment:
      OPAL_MAINTENANCE_DB_HOST: "{{ .Release.Name }}-postgresql"
      OPAL_MAINTENANCE_DB_NAME: opal
      OPAL_MAINTENANCE_DB_USERNAME: opal
      OPAL_MAINTENANCE_DB_PASSWORD: opal
      REDIS_CONNECTION_STRING: redis://${SERVICE_NAME}-hmcts-redis-master:6379
      OPAL_MAINTENANCE_DB_OPTIONS: "?stringtype=unspecified"
      OPAL_MAINTENANCE_DB_PORT: 5432
      RUN_DB_MIGRATION_ON_STARTUP: true
      FLYWAY_LOCATIONS: classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/dev
      APPLICATIONINSIGHTS_ROLE_NAME: "opal-rm-frontend-pr-${CHANGE_ID}-maintenance-service"
      SERVICEBUS_LOGGING_PDPL_QUEUE_NAME: "{{ .Release.Name}}-servicebus-logging-pdpl"
      TESTING_SUPPORT_ENDPOINTS_ENABLED: false
      OPAL_REDIS_ENABLED: true
      OPAL_USER_SERVICE_API_URL: https://opal-user-service.staging.platform.hmcts.net
      SERVICEBUS_LOGGING_PDPL_PROTOCOL: amqps
postgresql:
  enabled: ${DEV_ENABLE_OPAL_MAINTENANCE_SERVICE}
  image:
    tag: '17.5.0'
  auth:
    username: opal
    password: opal
    database: opal
  primary:
    persistence:
      enabled: false
    resourcesPreset: small
servicebus:
  enabled: ${DEV_ENABLE_OPAL_MAINTENANCE_SERVICE}
  releaseNameOverride: ${SERVICE_NAME}-servicebus
  resourceGroup: "opal-aso-dev-rg"
  sbNamespace: "opal-servicebus-dev"
  setup:
    queues:
      - name: "logging-pdpl"
redis:
  enabled: true
  architecture: standalone
  master:
    persistence:
      enabled: false
  auth:
    enabled: false
