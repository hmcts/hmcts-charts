nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  ingressAnnotations:
    external-dns.alpha.kubernetes.io/exclude: 'true'
  keyVaults:
    hmc:
      secrets:
        - AppInsightsInstrumentationKey
        - hmc-admin-ui-session-secret
        - hmc-admin-ui-client-secret
        - hmc-admin-ui-s2s-secret
  environment:
    HMC_ADMIN_UI_BASE_URL: https://${SERVICE_FQDN}
    REDIS_ENABLED: false
