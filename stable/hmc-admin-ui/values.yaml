nodejs:
  applicationPort: 3000
  aadIdentityName: hmc
  ingressHost: hmc-admin-ui.{{ .Values.global.environment }}.platform.hmcts.net
  image: 'hmctsprod.azurecr.io/hmc/admin-ui:latest'
  #  Uncomment once the vault containing the app insights key has been set up
  keyVaults:
    hmc:
      secrets:
        - AppInsightsInstrumentationKey
        - hmc-admin-ui-session-secret
        - hmc-admin-ui-client-secret
        - hmc-admin-ui-s2s-secret
        - admin-ui-managed-redis-connection-string
  environment:
    ALLOW_CONFIG_MUTATIONS: true
    REDIS_ENABLED: true
    REDIS_KEY_PREFIX: 'hmc-admin-sess:'
    IDAM_PUBLIC_URL: https://hmcts-access.{{ .Values.global.environment }}.platform.hmcts.net
    HMC_ADMIN_UI_BASE_URL: https://hmc-admin-ui.{{ .Values.global.environment }}.platform.hmcts.net
    HMC_CFT_HEARING_SERVICE_URL: http://hmc-cft-hearing-service-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
    SERVICES_S2S: http://rpe-service-auth-provider-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
