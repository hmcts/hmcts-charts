java:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    POSTGRES_HOST: "{{ .Release.Name }}-postgresql"
    POSTGRES_DB_NAME: "{{ .Values.postgresql.auth.database}}"
    POSTGRES_USERNAME: "{{ .Values.postgresql.auth.username}}"
    POSTGRES_PASSWORD: "{{ .Values.postgresql.auth.password}}"
    POSTGRES_PORT: "{{ .Values.postgresql.auth.port}}"
    COMMONDATA_DB: classpath:db/migration,classpath:db/postgres,classpath:db/migrationAks
    LAUNCH_DARKLY_ENV: "preview"
    ENVIRONMENT_NAME: "preview"
    JWT_ISSUER_VALIDATION_ENABLED: true
    IDAM_SECURITY_ALLOWED_ISSUERS_0: https://idam-web-public.aat.platform.hmcts.net/o
    IDAM_SECURITY_ALLOWED_ISSUERS_1: https://hmcts-access.aat.platform.hmcts.net/o
    IDAM_SECURITY_ALLOWED_ISSUERS_2: https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/realms/root/realms/hmcts
    IDAM_SECURITY_ALLOWED_ISSUERS_3: https://idam-api.aat.platform.hmcts.net/o
  postgresql:
    enabled: true
    auth:
      username: dbcommondata
      password: dbcommondata
      database: dbcommondata
      port: 5432
  keyVaults:
    rd:
      secrets:
        - name: app-insights-connection-string
          alias: app-insights-connection-string
        - name: LD-SDK-KEY
          alias: LD_SDK_KEY
        - name: commondata-api-POSTGRES-PASS
          alias: POSTGRES_PASSWORD
        - name: common-data-api-s2s-secret
          alias: COMMONDATA_API_S2S_SECRET
