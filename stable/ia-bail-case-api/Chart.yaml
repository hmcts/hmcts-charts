apiVersion: v2
description: A Helm chart for Bail Case API App
name: ia-bail-case-api
home: https://github.com/hmcts/ia-bail-case-api
version: 0.0.28
maintainers:
  - name: Immigration & Asylum Team
    email: ImmigrationandAsylum@HMCTS.NET
dependencies:
  - name: java
    version: 6.1.1
    repository: oci://hmctsprod.azurecr.io/helm
  # Everything below is preview-only: it stands up the CCD stack the pipeline
  # imports the Bail definition into. Disabled by default in values.yaml.
  - name: ccd
    version: 9.3.0
    repository: oci://hmctsprod.azurecr.io/helm
    condition: ccd.enabled
  - name: xui-webapp
    version: ~1.0.18
    repository: oci://hmctsprod.azurecr.io/helm
    condition: xui-webapp.enabled
  - name: ccd-case-document-am-api
    version: 1.7.18
    repository: oci://hmctsprod.azurecr.io/helm
    condition: ccd-case-document-am-api.enabled
  - name: aac-manage-case-assignment
    version: 0.2.22 # this version is fixed: do not include the ~
    repository: oci://hmctsprod.azurecr.io/helm
    condition: aac-manage-case-assignment.enabled
  - name: postgresql
    version: 1.1.3
    repository: oci://hmctsprod.azurecr.io/helm
    condition: postgresql.enabled
