java:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  devcpuRequests: 500m
  devmemoryRequests: 1Gi
  devcpuLimits: 2
  devmemoryLimits: 4Gi
  environment:
    CCD_URL: "http://{{ .Release.Name }}-ccd-data-store-api"
    AAC_URL: https://aac-${SERVICE_FQDN}
    CCD_GW_URL: "http://dm-store-aat.service.core-compute-aat.internal"
    DM_URL: "http://dm-store-aat.service.core-compute-aat.internal"
    CASE_DOCUMENT_AM_URL: http://${SERVICE_NAME}-ccd-case-document-am-api
    IA_IDAM_REDIRECT_URI: "https://ia-bail-case-api-aat.service.core-compute-aat.internal/oauth2/callback"
    IDAM_URL: "https://idam-api.aat.platform.hmcts.net"
    OPEN_ID_IDAM_URL: "https://idam-web-public.aat.platform.hmcts.net"
    S2S_URL: "http://rpe-service-auth-provider-aat.service.core-compute-aat.internal"
    PROF_REF_DATA_URL: "http://rd-professional-api-aat.service.core-compute-aat.internal"
    LOCATION_REF_DATA_URL: "http://rd-location-ref-api-aat.service.core-compute-aat.internal"
    COMMON_DATA_API: "http://rd-commondata-api-aat.service.core-compute-aat.internal"
    IA_CASE_DOCUMENTS_API_URL: "http://ia-case-documents-api-aat.service.core-compute-aat.internal/"
    IA_CASE_NOTIFICATIONS_API_URL: "http://ia-case-notifications-api-aat.service.core-compute-aat.internal/"
    IA_TIMED_EVENT_SERVICE_URL: "http://ia-timed-event-service-aat.service.core-compute-aat.internal/"
    IA_TIMED_EVENT_SERVICE_ENABLED: "false"

global:
  postgresHostname: "ia-preview.postgres.database.azure.com"
  postgresSecret: postgres
  # Distinct from ia-case-api's "pr-<id>-" prefix: both repos create preview
  # databases on the same flexible server and their PR numbers are unrelated.
  databaseNamePrefix: "bail-pr-${CHANGE_ID}-"

postgresql:
  enabled: true
  flexibleserver: ia-preview
  setup:
    databases:
      - name: "bail-pr-${CHANGE_ID}-data-store"
      - name: "bail-pr-${CHANGE_ID}-definition-store"
      - name: "bail-pr-${CHANGE_ID}-user-profile"
      - name: "bail-pr-${CHANGE_ID}-role_assignment"

ccd-case-document-am-api:
  enabled: true
  java:
    image: hmctsprod.azurecr.io/ccd/case-document-am-api:latest
    releaseNameOverride: ${SERVICE_NAME}-ccd-case-document-am-api
    environment:
      CCD_DATA_STORE_API_BASE_URL: http://{{ .Release.Name }}-ccd-data-store-api
      IDAM_API_URL: https://idam-api.aat.platform.hmcts.net
      IDAM_OIDC_URL: https://idam-web-public.aat.platform.hmcts.net
      OIDC_ISSUER: https://forgerock-am.service.core-compute-idam-aat.internal:8443/openam/oauth2/hmcts
      S2S_URL: http://rpe-service-auth-provider-aat.service.core-compute-aat.internal
      DM_STORE_BASE_URL: http://dm-store-aat.service.core-compute-aat.internal

aac-manage-case-assignment:
  enabled: true
  java:
    devcpuRequests: 500m
    devmemoryRequests: 1Gi
    devcpuLimits: 2
    devmemoryLimits: 4Gi
    imagePullPolicy: Always
    releaseNameOverride: ${SERVICE_NAME}-aac-manage-case-assignment
    image: hmctsprod.azurecr.io/aac/manage-case-assignment:latest
    ingressHost: aac-${SERVICE_FQDN}
    environment:
      IDAM_API_URL: https://idam-api.aat.platform.hmcts.net
      IDAM_OIDC_URL: https://idam-web-public.aat.platform.hmcts.net
      OIDC_ISSUER: https://forgerock-am.service.core-compute-idam-aat.internal:8443/openam/oauth2/hmcts
      S2S_URL: http://rpe-service-auth-provider-aat.service.core-compute-aat.internal
      MCA_DS_PROXY_URLS_ALLOWED_LIST: /searchCases.*,/internal/searchCases.*,/internal/cases.*
      MCA_DEF_STORE_PROXY_URLS_ALLOWED_LIST: /api/display/challenge-questions.*
      MCA_CONDITIONAL_APIS_CASE_ASSIGNMENTS_ENABLED: "true"
      MANAGE_CASE_S2S_AUTHORISED_SERVICES: xui_webapp,ccd_data,ccd_gw,iac
      CCD_DATA_STORE_API_BASE_URL: https://ccd-data-store-api-${SERVICE_FQDN}
      CCD_DEFINITION_STORE_API_BASE_URL: https://ccd-definition-store-${SERVICE_FQDN}
      PRD_HOST: http://rd-professional-api-aat.service.core-compute-aat.internal
      CCD_DEFINITION_STORE_ALLOWED_SERVICE: xui_webapp
      CCD_DATA_STORE_ALLOWED_SERVICE: xui_webapp
      ROLE_ASSIGNMENT_URL: https://am-role-assignment-${SERVICE_FQDN}
    autoscaling:
      enabled: false
    keyVaults:
      aac:
        resourceGroup: aac
        secrets:
          - name: aac-manage-case-s2s-secret
            alias: MANAGE_CASE_S2S_KEY
          - name: idam-mca-client-secret
            alias: IDAM_CLIENT_SECRET
          - name: idam-mca-system-user-username
            alias: IDAM_CAA_USERNAME
          - name: idam-mca-system-user-password
            alias: IDAM_CAA_PASSWORD
          - name: idam-noc-approver-username
            alias: IDAM_NOC_APPROVER_USERNAME
          - name: idam-noc-approver-password
            alias: IDAM_NOC_APPROVER_PASSWORD
          - name: notify-mca-api-key-secret
            alias: NOTIFY_MCA_API_KEY

# https://github.com/hmcts/rpx-xui-webapp/blob/master/charts/xui-webapp/Chart.yaml
xui-webapp:
  enabled: true
  nodejs:
    imagePullPolicy: Always
    releaseNameOverride: ${SERVICE_NAME}-xui-webapp
    image: hmctsprod.azurecr.io/xui/webapp:latest
    ingressHost: xui-${SERVICE_FQDN}
    memoryRequests: 2Gi
    cpuRequests: 2000m
    memoryLimits: 4Gi
    cpuLimits: 3500m
    devmemoryRequests: 6Gi
    devcpuRequests: 2000m
    devmemoryLimits: 8Gi
    devcpuLimits: 4500m
    environment:
      HEALTH_CCD_COMPONENT_API: http://gateway-${SERVICE_FQDN}/health
      HEALTH_CCD_DATA_API: https://ccd-data-store-api-${SERVICE_FQDN}/health
      HEALTH_TERMS_AND_CONDITIONS_API: https://xui-terms-and-conditions-${SERVICE_FQDN}/health
      SERVICES_EM_ANNO_API: http://{{ .Release.Name }}-ccd-api-gw
      SERVICES_CCD_COMPONENT_API: http://{{ .Release.Name }}-ccd-api-gw
      SERVICES_CCD_DATA_STORE_API: https://ccd-data-store-api-${SERVICE_FQDN}
      SERVICES_TERMS_AND_CONDITIONS: https://xui-terms-and-conditions-${SERVICE_FQDN}
      SERVICES_IDAM_API_URL: https://idam-api.aat.platform.hmcts.net
      SERVICES_S2S: http://rpe-service-auth-provider-aat.service.core-compute-aat.internal
      SERVICES_PRD_LOCATION_API: http://rd-location-ref-api-aat.service.core-compute-aat.internal
      SERVICES_PRD_JUDICIAL_API: http://rd-judicial-api-aat.service.core-compute-aat.internal
      SERVICES_PRD_COMMONDATA_API: http://rd-commondata-api-aat.service.core-compute-aat.internal
      SERVICES_PRD_API: http://rd-professional-api-aat.service.core-compute-aat.internal
      SERVICES_CCD_CASE_ASSIGNMENT_API: https://aac-${SERVICE_FQDN}
      SERVICES_DOCUMENTS_API_V2: http://${SERVICE_NAME}-ccd-case-document-am-api
      SERVICES_IDAM_ISS_URL: https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/realms/root/realms/hmcts
      SERVICES_ROLE_ASSIGNMENT_API: https://am-role-assignment-${SERVICE_FQDN}
      JURISDICTIONS: IA
      GLOBAL_SEARCH_SERVICES: IA
      LAUNCH_DARKLY_CLIENT_ID: 5de6610b23ce5408280f2268
      FEATURE_REDIS_ENABLED: false
      FEATURE_APP_INSIGHTS_ENABLED: false
      FEATURE_SECURE_COOKIE_ENABLED: false
      FEATURE_PROXY_ENABLED: false
      FEATURE_TERMS_AND_CONDITIONS_ENABLED: false
      FEATURE_HELMET_ENABLED: false
      FEATURE_OIDC_ENABLED: false
      # No Work Allocation stack in this preview
      FEATURE_WORKALLOCATION_ENABLED: false
      FEATURE_ACCESS_MANAGEMENT_ENABLED: true
      FEATURE_SUBSTANTIVE_ROLE_ENABLED: true
      FEATURE_JRD_E_LINKS_V2_ENABLED: true
      NOW: false
      REDISCLOUD_URL: http://dummyrediscloudurl
      UV_THREADPOOL_SIZE: 128
      PROTOCOL: http

ccd:
  enabled: true
  ccd:
    adminWeb:
      enabled: true
    managementWeb:
      enabled: false
    # The pipeline's High Level Data Setup stage imports the definition instead
    definitionImporter:
      enabled: false
    userProfileImporter:
      enabled: false
    apiGatewayWeb:
      enabled: true
    postgresql:
      enabled: false
    s2s:
      enabled: false
    elastic:
      enabled: true
    ras:
      enabled: true
  global:
    ccdApiGatewayIngress: http://{{ .Release.Name }}-ccd-api-gw
    ccdAdminWebIngress: admin-web-${SERVICE_FQDN}
    ccdDataStoreUrl: http://{{ .Release.Name }}-ccd-data-store-api
    ccdDefinitionStoreUrl: http://{{ .Release.Name }}-ccd-definition-store
    ccdUserProfileUrl: https://ccd-user-profile-api-${SERVICE_FQDN}
    dmStoreUrl: http://dm-store-aat.service.core-compute-aat.internal
    idamApiUrl: https://idam-api.aat.platform.hmcts.net
    idamWebUrl: https://idam-web-public.aat.platform.hmcts.net
    s2sUrl: http://rpe-service-auth-provider-aat.service.core-compute-aat.internal
    enableKeyVaults: true
    devMode: true

  ccd-api-gateway-web:
    nodejs:
      imagePullPolicy: Always
      image: hmctsprod.azurecr.io/ccd/api-gateway-web:latest
      devcpuRequests: 500m
      devmemoryRequests: 1Gi
      devcpuLimits: 1
      devmemoryLimits: 4Gi
      environment:
        ADDRESS_LOOKUP_TOKEN: ${ADDRESS_LOOKUP_TOKEN}
        IDAM_SERVICE_KEY: ${API_GATEWAY_S2S_KEY}
        IDAM_OAUTH2_CLIENT_SECRET: ${CCD_API_GATEWAY_IDAM_CLIENT_SECRET}
        PROXY_DOCUMENT_MANAGEMENT: http://dm-store-aat.service.core-compute-aat.internal
      ingressHost: gateway-${SERVICE_FQDN}
      ingressIP: ${INGRESS_IP}

  ccd-user-profile-api:
    java:
      autoscaling:
        enabled: false
      imagePullPolicy: Always
      image: hmctsprod.azurecr.io/ccd/user-profile-api:latest
      keyVaults: [ ]
      devcpuRequests: 500m
      devmemoryRequests: 1Gi
      devcpuLimits: 2
      devmemoryLimits: 4Gi
      environment:
        USER_PROFILE_S2S_AUTHORISED_SERVICES: ccd_data,ccd_definition,ccd_admin
        USER_PROFILE_DB_HOST: ia-preview.postgres.database.azure.com
        USER_PROFILE_DB_NAME: "bail-pr-${CHANGE_ID}-user-profile"
        USER_PROFILE_HOST: http://${SERVICE_NAME}-ccd-user-profile-api
      ingressHost: ccd-user-profile-api-${SERVICE_FQDN}

  ccd-definition-store-api:
    java:
      image: hmctsprod.azurecr.io/ccd/definition-store-api:latest
      imagePullPolicy: Always
      devcpuRequests: 500m
      devmemoryRequests: 1Gi
      devcpuLimits: 2
      devmemoryLimits: 4Gi
      autoscaling:
        enabled: false
      environment:
        DEFINITION_STORE_DB_HOST: ia-preview.postgres.database.azure.com
        DEFINITION_STORE_DB_NAME: "bail-pr-${CHANGE_ID}-definition-store"
        DEFINITION_STORE_IDAM_KEY: ${DEFINITION_STORE_S2S_KEY}
        IDAM_USER_URL: https://idam-web-public.aat.platform.hmcts.net
        DATA_STORE_S2S_AUTHORISED_SERVICES: ccd_gw,ccd_admin,ccd_gateway,ccd_data,ccd_ps,aac_manage_case_assignment,xui_webapp,iac,ccd_case_document_am_api,am_role_assignment_service
        OIDC_ISSUER: https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/hmcts
        ELASTIC_SEARCH_ENABLED: true
        ELASTIC_SEARCH_HOST: ${SERVICE_NAME}-es-master
        ELASTIC_SEARCH_SCHEME: http
        ELASTIC_SEARCH_FAIL_ON_IMPORT: false
        USER_PROFILE_HOST: https://ccd-user-profile-api-${SERVICE_FQDN}
      keyVaults: [ ]
      ingressHost: ccd-definition-store-${SERVICE_FQDN}

  ccd-data-store-api:
    java:
      imagePullPolicy: Always
      devcpuRequests: 1000m
      devmemoryRequests: 1Gi
      devcpuLimits: 1
      devmemoryLimits: 4Gi
      autoscaling:
        enabled: false
      disableKeyVaults: true
      environment:
        DATA_STORE_DB_HOST: ia-preview.postgres.database.azure.com
        DATA_STORE_DB_NAME: "bail-pr-${CHANGE_ID}-data-store"
        DATA_STORE_DB_USERNAME: hmcts
        DATA_STORE_DB_PASSWORD: ${GENERIC_VALUES_PREVIEW_YAML_PASS}
        DATA_STORE_IDAM_KEY: ${DATA_STORE_S2S_KEY}
        DATA_STORE_CROSS_JURISDICTIONAL_ROLES: caseworker-caa,caseworker-approver
        DATA_STORE_S2S_AUTHORISED_SERVICES: ccd_gw,ccd_gateway,ccd_data,ccd_ps,aac_manage_case_assignment,xui_webapp,ccd_case_document_am_api,iac,am_role_assignment_service,ccd_next_hearing_date_updater
        IDAM_API_BASE_URL: https://idam-api.aat.platform.hmcts.net
        IDAM_OIDC_URL: https://idam-web-public.aat.platform.hmcts.net
        # AAT IDAM issues tokens with iss=https://idam-web-public.aat.platform.hmcts.net/o. Without
        # this the data store keeps its defaults, which name neither that nor the AAT forgerock
        # issuer, and rejects every user token with INVALID_ISSUER.
        OIDC_ALLOWED_ISSUERS: https://idam-web-public.aat.platform.hmcts.net/o,https://forgerock-am.service.core-compute-idam-aat.internal:8443/openam/oauth2/hmcts,https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/hmcts
        IDAM_OAUTH2_DATA_STORE_CLIENT_SECRET: ${IDAM_OAUTH2_DATA_STORE_CLIENT_SECRET}
        IDAM_DATA_STORE_SYSTEM_USER_USERNAME: ${IDAM_DATA_STORE_SYSTEM_USER_USERNAME}
        IDAM_DATA_STORE_SYSTEM_USER_PASSWORD: ${IDAM_DATA_STORE_SYSTEM_USER_PASSWORD}
        CASE_DOCUMENT_AM_URL: http://${SERVICE_NAME}-ccd-case-document-am-api
        ROLE_ASSIGNMENT_URL: https://am-role-assignment-${SERVICE_FQDN}
        USER_PROFILE_HOST: https://ccd-user-profile-api-${SERVICE_FQDN}
        DEFINITION_STORE_HOST: https://ccd-definition-store-${SERVICE_FQDN}
        ELASTIC_SEARCH_ENABLED: true
        ELASTIC_SEARCH_HOSTS: ${SERVICE_NAME}-es-master:9200
        ELASTIC_SEARCH_SCHEME: http
        ELASTIC_SEARCH_DATA_NODES_HOSTS: http://${SERVICE_NAME}-es-master:9200
        ENABLE_ATTRIBUTE_BASED_ACCESS_CONTROL: true
        ENABLE_PSEUDO_ROLE_ASSIGNMENTS_GENERATION: true
        ENABLE_PSEUDO_ACCESS_PROFILES_GENERATION: true
      keyVaults: []
      ingressHost: ccd-data-store-api-${SERVICE_FQDN}

  am-role-assignment-service:
    java:
      autoscaling:
        enabled: false
      imagePullPolicy: Always
      image: hmctsprod.azurecr.io/am/role-assignment-service:latest
      ingressHost: am-role-assignment-${SERVICE_FQDN}
      devcpuRequests: 500m
      devmemoryRequests: 1Gi
      devcpuLimits: 1
      devmemoryLimits: 4Gi
      startupFailureThreshold: 20
      environment:
        CCD_DATA_STORE_URL: http://{{ .Release.Name }}-ccd-data-store-api
        ROLE_ASSIGNMENT_S2S_AUTHORISED_SERVICES: ccd_gw,am_role_assignment_service,am_org_role_mapping_service,xui_webapp,aac_manage_case_assignment,ccd_data,iac
        RUN_LD_ON_STARTUP: false
        ORM_ENV: pr
        APPLICATION_LOGGING_LEVEL: TRACE
        ROLE_ASSIGNMENT_DB_HOST: ia-preview.postgres.database.azure.com
        ROLE_ASSIGNMENT_DB_NAME: "bail-pr-${CHANGE_ID}-role_assignment"
        ROLE_ASSIGNMENT_DB_OPTIONS: "?stringtype=unspecified&ssl=disable&gssEncMode=disable"
      keyVaults:
        am:
          resourceGroup: am
          secrets:
            - name: am-role-assignment-service-s2s-secret
              alias: AM_ROLE_ASSIGNMENT_SERVICE_SECRET
            - name: app-insights-connection-string
              alias: app-insights-connection-string
            - name: role-assignment-service-IDAM-CLIENT-SECRET
              alias: ROLE_ASSIGNMENT_IDAM_CLIENT_SECRET
            - name: role-assignment-service-IDAM-ADMIN-SECRET
              alias: ROLE_ASSIGNMENT_IDAM_ADMIN_PASSWORD
            - name: role-assignment-service-LD-SDK-KEY
              alias: LD_SDK_KEY
      secrets:
        ROLE_ASSIGNMENT_DB_PASSWORD:
          secretRef: postgres
          key: PASSWORD
          disabled: false

  ccd-admin-web:
    nodejs:
      image: hmctsprod.azurecr.io/ccd/admin-web:latest
      ingressHost: admin-web-${SERVICE_FQDN}
      environment:
        IDAM_ADMIN_WEB_SERVICE_KEY: ${ADMIN_S2S_KEY}
        IDAM_OAUTH2_AW_CLIENT_SECRET: ${ADMIN_WEB_IDAM_SECRET}
        ADMINWEB_ELASTIC_INDEX_URL: https://ccd-definition-store-${SERVICE_FQDN}/elastic-support/index
        ADMINWEB_ELASTIC_CASE_TYPES_URL: https://ccd-definition-store-${SERVICE_FQDN}/elastic-support/case-types
        ADMINWEB_GLOBAL_SEARCH_INDEX_URL: https://ccd-definition-store-${SERVICE_FQDN}/elastic-support/global-search/index
        SESSION_KEYS: '${SESSION_KEYS}'
      keyVaults:
        ccd:
          resourceGroup: ccd
          secrets:
            - name: session-keys
              alias: SESSION_KEYS

  elasticsearch:
    image: hmctsprod.azurecr.io/imported/elastic/elasticsearch
    imageTag: 9.2.3
    nameOverride: ${SERVICE_NAME}-es
    clusterName: "es"
    createCert: false
    protocol: http
    replicas: 1
    minimumMasterNodes: 1
    antiAffinity: "soft"
    esJavaOpts: "-Xmx512m -Xms512m"
    esConfig:
      elasticsearch.yml: |
        action.auto_create_index: .security*,.watches,.triggered_watches,.watcher-history-*,.logstash_dead_letter,.ml*,ccd-logstash-dead-letter
        xpack.security.enabled: false
    tests:
      enabled: false
    persistence:
      enabled: false
    ingress:
      enabled: false
      className: traefik

  logstash:
    image: "hmctsprod.azurecr.io/imported/elastic/logstash"
    imageTag: "9.2.4"
    imagePullPolicy: "IfNotPresent"
    logstashJavaOpts: "-Xmx1g -Xms512M"
    extraInitContainers: |
      - name: download-postgres-jdbc
        image: hmctsprod.azurecr.io/curl:7.70.0
        command: ['curl', '-L', 'https://jdbc.postgresql.org/download/postgresql-42.7.9.jar', '-o', '/logstash-lib/postgresql.jar']
        volumeMounts:
        - name: logstash-lib
          mountPath: /logstash-lib
    extraVolumes: |
      - name: logstash-lib
        emptyDir: {}
      - name: database-secret-volume
        secret:
          secretName: postgres
    extraVolumeMounts: |
      - name: logstash-lib
        mountPath: /usr/share/logstash/ccd
      - name: database-secret-volume
        mountPath: /etc/logstash/secrets
        readOnly: true
    logstashConfig:
      logstash.yml: |
        api.http.host: 0.0.0.0
        xpack.monitoring.enabled: false
        xpack.monitoring.elasticsearch.hosts: ["http://{{ .Release.Name }}-es-master:9200"]
        queue.type: persisted
        dead_letter_queue.enable: true
        pipeline.ecs_compatibility: disabled
      pipelines.yml: |
        - pipeline.id: main
          path.config: "/usr/share/logstash/pipeline/{01_input,02_filter,03_output}.conf"
          queue.type: persisted
    logstashPipeline:
      01_input.conf: |
        input  {
          jdbc {
            jdbc_connection_string => "jdbc:postgresql://ia-preview.postgres.database.azure.com:5432/bail-pr-${CHANGE_ID}-data-store?sslmode=require&stringtype=unspecified"
            jdbc_user => "hmcts"
            jdbc_password_filepath => "/etc/logstash/secrets/PASSWORD"
            jdbc_validate_connection => true
            jdbc_driver_library => "/usr/share/logstash/ccd/postgresql.jar"
            jdbc_driver_class => "org.postgresql.Driver"
            jdbc_default_timezone => "UTC"
            statement => "UPDATE case_data SET marked_by_logstash = true WHERE marked_by_logstash = false RETURNING id, created_date, last_modified, jurisdiction, case_type_id, state, last_state_modified_date, data::TEXT as json_data, data_classification::TEXT as json_data_classification, reference, security_classification, supplementary_data::TEXT as json_supplementary_data"
            clean_run => false
            schedule => "* * * * * *"
          }
        }
      02_filter.conf: |
        filter{
          json{
              source => "json_data"
              target => "data"
              remove_field => ["json_data"]
              }
              json{
                  source => "json_supplementary_data"
                  target => "supplementary_data"
                  remove_field => ["json_supplementary_data"]
              }
              json{
                  source => "json_data_classification"
                  target => "data_classification"
                  remove_field => ["json_data_classification"]
              }
              if [data][SearchCriteria] {
                  clone {
                      clones => ["SearchCriteria"]
                  }
              }
              if [type] == "SearchCriteria" {
                  if [data][SearchCriteria] {
                      mutate {
                        rename => {"[data][SearchCriteria]" => "[data_new][SearchCriteria]" }
                      }
                  }
                  if [data][caseManagementLocation] {
                      mutate {
                        rename => {"[data][caseManagementLocation]" => "[data_new][caseManagementLocation]" }
                      }
                  }
                  if [data][CaseAccessCategory] {
                    mutate {
                        rename => {"[data][CaseAccessCategory]" => "[data_new][CaseAccessCategory]" }
                    }
                  }
                  if [data][caseNameHmctsInternal] {
                      mutate {
                        rename => {"[data][caseNameHmctsInternal]" => "[data_new][caseNameHmctsInternal]" }
                      }
                  }
                  if [data][caseManagementCategory] {
                      mutate {
                        rename => {"[data][caseManagementCategory]" => "[data_new][caseManagementCategory]" }
                      }
                  }
                  if [supplementary_data][HMCTSServiceId] {
                      mutate {
                        rename => {"[supplementary_data][HMCTSServiceId]" => "[supplementary_data_new][HMCTSServiceId]" }
                      }
                  }
                  if [data_classification][SearchCriteria] {
                      mutate {
                        rename => {"[data_classification][SearchCriteria]" => "[data_classification_new][SearchCriteria]" }
                      }
                  }
                  if [data_classification][CaseAccessCategory] {
                    mutate {
                          rename => {"[data_classification][CaseAccessCategory]" => "[data_classification_new][CaseAccessCategory]" }
                    }
                  }
                  if [data_classification][caseManagementLocation] {
                    mutate {
                        rename => {"[data_classification][caseManagementLocation]" => "[data_classification_new][caseManagementLocation]" }
                    }
                  }
                  if [data_classification][caseNameHmctsInternal] {
                      mutate {
                        rename => {"[data_classification][caseNameHmctsInternal]" => "[data_classification_new][caseNameHmctsInternal]" }
                      }
                  }
                  if [data_classification][caseManagementCategory] {
                      mutate {
                        rename => {"[data_classification][caseManagementCategory]" => "[data_classification_new][caseManagementCategory]" }
                      }
                  }
                  mutate { remove_field =>[ "data" ,"supplementary_data", "data_classification", "last_state_modified_date", "type","last_modified", "created_date" ] }
                  mutate {
                          rename => { "[data_new]" => "data" }
                          rename => { "[supplementary_data_new]"  => "supplementary_data" }
                          rename => { "[data_classification_new]"  => "data_classification" }
                  }
                  mutate {
                    add_field => { "index_id" => "global_search" }
                  }
                  mutate {
                    lowercase => [ "index_id" ]
                  }
              } else {
                  mutate {
                      add_field => { "index_id" => "%{case_type_id}_cases" }
                }
              mutate {
                lowercase => [ "index_id" ]
              }
              }
        }
      03_output.conf: |
        output {
            elasticsearch {
                hosts => ["http://{{ .Release.Name }}-es-master:9200"]
                sniffing => false
                index => "%{[index_id]}"
                document_type => "_doc"
                document_id => "%{id}"
                timeout => 60
            }
        }
