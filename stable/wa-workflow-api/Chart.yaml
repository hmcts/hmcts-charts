apiVersion: v2
appVersion: "1.0"
description: A Helm chart for wa-workflow-api App
name: wa-workflow-api
home: https://github.com/hmcts/wa-workflow-api
version: 0.1.6
maintainers:
  - name: HMCTS wa team
dependencies:
  - name: java
    version: 6.1.1
    repository: 'oci://hmctsprod.azurecr.io/helm'

  # WA
  - name: wa
    version: ~1.1.2
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: wa.enabled
  - name: camunda-bpm
    version: 0.0.52
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: camunda-bpm.enabled
