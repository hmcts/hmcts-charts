nodejs:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  additionalIngressHosts: []
  replicas: 1
  saEnabled: true
  keyVaults:
    dtsse:
      secrets:
        - name: AppInsightsConnectionString
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
        - name: agent-hub-entra-client-id
          alias: ENTRA_CLIENT_ID
  secrets:
    POSTGRES_HOST:
      secretRef: postgres
      key: HOST
    POSTGRES_PORT:
      secretRef: postgres
      key: PORT
    POSTGRES_USER:
      secretRef: postgres
      key: USER
    POSTGRES_PASSWORD:
      secretRef: postgres
      key: PASSWORD
  environment:
    POSTGRES_DATABASE: "{{ .Release.Name }}"
    AUTH_DISABLED: "true"
    VIRTUAL_AGENTS_ENABLED: "false"
    AGENT_HUB_VIEWER_HOST: ""
    FEEDBACK_ENABLED: "false"
    FEEDBACK_STORAGE_ACCOUNT_URL: ""

postgresql:
  enabled: true
  flexibleserver: dtsse-preview
  setup:
    databases:
      - name: "{{ .Release.Name }}"
