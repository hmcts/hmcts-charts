# The pipeline's temporary `-staging` release. The persistent AAT release is Flux's, from values.yaml.
nodejs:
  saEnabled: true
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  # The viewer's host belongs to the persistent AAT release alone.
  additionalIngressHosts: []
  environment:
    AUTH_DISABLED: "true"
    VIRTUAL_AGENTS_ENABLED: "false"
    AGENT_HUB_VIEWER_HOST: ""
