apiVersion: v2
appVersion: "1.0"
description: Relay and topic boards for Claude Code sessions across HMCTS
name: dtsse-agent-hub
home: https://github.com/hmcts/dtsse-agent-hub
# Bump this in any commit that touches `values.yaml`: Flux resolves the chart by version string, so a values change
# published under a version AAT already has is silently ignored.
version: 0.0.3
dependencies:
  - name: nodejs
    version: 3.2.1
    repository: "oci://hmctsprod.azurecr.io/helm"
  - name: postgresql
    version: 1.1.1
    repository: "oci://hmctsprod.azurecr.io/helm"
    condition: postgresql.enabled
