apiVersion: v2
appVersion: "1.0"
description: A Helm chart for pt-api App
name: pt-api
home: https://github.com/hmcts/pt-api
version: 0.0.54
maintainers:
  - name: HMCTS pt team
dependencies:
  - name: java
    version: 6.1.1
    repository: 'oci://hmctsprod.azurecr.io/helm'
  - name: postgresql
    version: 1.1.3
    repository: 'oci://hmctsprod.azurecr.io/helm'
  - name: ccd
    version: 9.3.0
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: ccd.enabled
  - name: xui-webapp
    version: 1.0.51
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: xui-webapp.enabled
  #    Work Allocation
  - name: wa
    version: ~1.1.0
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: wa.enabled
  - name: am-org-role-mapping-service
    version: ~0.0.66
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: am-org-role-mapping-service.enabled
  - name: ccd-case-document-am-api
    version: 1.7.19
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: ccd-case-document-am-api.enabled
  - name: ccd-case-disposer
    version: 0.2.38
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: ccd-case-disposer.enabled
