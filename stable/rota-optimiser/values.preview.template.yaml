java:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  # Preview uses its own PostgreSQL server and Kubernetes credential reference.
  disableKeyVaults: true
  environment:
    # Preserve the Java 21 image's memory/encoding options, without the AAT-backed
    # Application Insights agent. Preview has no telemetry connection string.
    JAVA_TOOL_OPTIONS: >-
      -XX:InitialRAMPercentage=30.0 -XX:MaxRAMPercentage=65.0
      -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
    ROTA_DB_URL: jdbc:postgresql://rota-preview.postgres.database.azure.com:5432/pr-${CHANGE_ID}-rota-optimiser?sslmode=require
    ROTA_DB_USERNAME: hmcts
    # PR previews are exercised without an operationally seeded shared HMAC key.
    ROTA_OPTIMISER_HMAC_ENABLED: false
  secrets:
    ROTA_DB_PASSWORD:
      secretRef: postgres
      key: PASSWORD
      disabled: false

postgresql:
  enabled: true
  flexibleserver: rota-preview
  setup:
    databases:
      - name: pr-${CHANGE_ID}-rota-optimiser
