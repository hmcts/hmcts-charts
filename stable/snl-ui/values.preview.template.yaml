nodejs:
  keyVaults:
    snl:
      disabled: true
    snl-aat:
      excludeEnvironmentSuffix: true
      mountPath: /mnt/secrets/snl
      secrets:
        - nodejs-app-insights-connection-string
        - session-secret
        - cft-idam-client-secret
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    IDAM_ISSUER_URL: https://hmcts-access.aat.platform.hmcts.net/o
    IDAM_BASE_URL: https://${SERVICE_FQDN}
    IDAM_MFA_ENABLED: 'false'
