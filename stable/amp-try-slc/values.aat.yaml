# Don't modify this file, it is only needed for the pipeline to set the image and ingressHost
java:
  # The ephemeral amp-try-slc-staging slot, not amp-try-slc.aat.platform.hmcts.net - that one is
  # Flux-managed from hmcts-charts plus cnp-flux-config/apps/amp/amp-try-slc/aat.yaml, and this
  # file never reaches it.
  #
  # Self-issued, so the functional stage can mint a token and exercise the 200 path. CI holds no
  # Entra client secret, and an ENTRA staging slot could only ever prove the 401.
  environment:
    AUTH_KEY_SOURCE: "SELF_ISSUED"
  image: https://hmcts.azurecr.io/hmcts/amp-try-slc:latest
  ingressHost: amp-try-slc-staging.aat.platform.hmcts.net
  keyVaults:
    amp-try-slc:
      secrets:
        - name: try-slc-DEMO-SIGNING-KEY-JWK
          alias: DEMO_SIGNING_KEY_JWK
        - name: try-slc-POSTGRES-USER
          alias: POSTGRES_USER
        - name: try-slc-POSTGRES-PASS
          alias: POSTGRES_PASS
        - name: try-slc-POSTGRES-HOST
          alias: POSTGRES_HOST
        - name: try-slc-POSTGRES-PORT
          alias: POSTGRES_PORT
        - name: try-slc-POSTGRES-DATABASE
          alias: POSTGRES_DATABASE
