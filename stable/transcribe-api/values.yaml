python:
  applicationPort: 8000
  image: 'hmctsprod.azurecr.io/transcribe/api:latest'
  ingressHost: transcribe-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal

  # The base chart defaults these to /health/liveness and /health/readiness,
  # which this service does not serve — leaving them unset makes every pod fail
  # its probes and the release never goes ready. Both upstream apps mounted
  # their health endpoint under the /api prefix (see api/app.py).
  readinessPath: /api/health
  livenessPath: /api/health
  startupPath: /api/health

  environment:
    # Non-secret configuration only. Anything sensitive comes from Key Vault,
    # either as a mounted file (keyVaults below) or, where an env var is
    # genuinely required, substituted into values.{env}.template.yaml.
    ENVIRONMENT: '{{ .Values.global.environment }}'
    AZURE_STORAGE_CONTAINER_NAME: audio
    AZURE_STORAGE_TRANSCRIPTION_CONTAINER: transcriptions
    # Background pollers run as their own workload (architecture 4.3), so the
    # request-serving deployment must not start them.
    RUN_WORKERS: 'false'
    # Callers are authenticated from a verified Entra ID bearer token only
    # (domain/auth/token_auth.py). Pinned on explicitly rather than left to
    # library defaults; the app also refuses an unverified token regardless.
    JWT_ENABLE_VERIFICATION: 'true'
    JWT_VERIFICATION_STRICT: 'true'
    # Tokens are issued by the MoJ tenant (JusticeUK) to the same app
    # registrations courtstranscribe and batch-audio-transcription use. The
    # IDs are not secret; the client ID (the expected audience) differs per
    # environment and is set in values.<env>.template.yaml.
    AZURE_AD_TENANT_ID: c6874728-71e6-41fe-a9e1-2e8c36776ad8

  keyVaults:
    # Resolves to Key Vault "transcribe-{env}". The CSI driver mounts each
    # secret as a FILE at /mnt/secrets/transcribe/<alias> — it does NOT set
    # environment variables. Each alias is spelled as the environment variable
    # it stands for, and runtime/secret_files.py loads the files into the
    # environment at package import, so every reader (our settings and the
    # auth library's) sees them.
    #
    # Every secret listed here must exist in the vault or the CSI driver will
    # not mount any of them and the pod will not start — so list only what the
    # app reads.
    transcribe:
      secrets:
        - name: database-connection-string
          alias: DATABASE_CONNECTION_STRING
        - name: azure-storage-account-name
          alias: AZURE_STORAGE_ACCOUNT_NAME
        # Speech authenticates with Entra, not an API key: the account is
        # built with local_auth_enabled = false so no key exists. Setting
        # AZURE_SPEECH_RESOURCE_ID selects the Managed Identity path in
        # routes_dictation.py, which mints an aad#<resourceId>#<token>.
        - name: azure-speech-resource-id
          alias: AZURE_SPEECH_RESOURCE_ID
        - name: azure-speech-endpoint
          alias: AZURE_SPEECH_ENDPOINT
        # Generated by infrastructure/secrets.tf.
        - name: webhook-secret-encryption-key
          alias: WEBHOOK_SECRET_ENCRYPTION_KEY
        # Not listed yet, because they would stop the pod starting until they
        # exist: azure-openai-api-key / azure-openai-endpoint (no Azure OpenAI
        # is provisioned for this product yet, so document generation is
        # unavailable) and gov-notify-api-key (email notifications are skipped
        # without it). Both are optional in settings_dictation.py. Add them
        # back here once the secrets exist in the vault.

  # Off by default: AAT uses the Azure Postgres Flexible Server built by
  # infrastructure/. Preview turns this on so per-PR environments are
  # self-contained (values.preview.template.yaml).
  postgresql:
    enabled: false
