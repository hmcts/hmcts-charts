python:
  applicationPort: 8000
  image: &image 'hmctsprod.azurecr.io/transcribe/api:latest'
  ingressHost: transcribe-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal

  # The base chart's /health/liveness and /health/readiness are not served.
  readinessPath: /api/health
  livenessPath: /api/health
  startupPath: /api/health

  environment: &environment
    ENVIRONMENT: '{{ .Values.global.environment }}'
    # cloud_RoleName in Application Insights.
    OTEL_SERVICE_NAME: transcribe-api
    AZURE_STORAGE_CONTAINER_NAME: audio
    AZURE_STORAGE_TRANSCRIPTION_CONTAINER: transcriptions
    # Background pollers run as a separate workload.
    RUN_WORKERS: 'false'
    # Bring the database schema up to date at startup (runtime/migrations.py).
    RUN_MIGRATIONS: 'true'
    JWT_ENABLE_VERIFICATION: 'true'
    JWT_VERIFICATION_STRICT: 'true'
    # HMCTS tenant (CJS Common Platform); the client ID is per environment
    # (values.<env>.template.yaml): app registrations from hmcts/central-app-registration.
    AZURE_AD_TENANT_ID: 531ff96d-0ae9-462a-8d2d-bec7c0b42082
    # Comma-separated app roles; a caller must hold at least one. Backs up
    # "Assignment required" on the app registration. Empty: not checked.
    # Switched on per environment in cnp-flux-config.
    AUTH_ACCESS_ROLES: ''

  keyVaults: &keyVaults
    # Mounted as files under /mnt/secrets/transcribe and loaded into the
    # environment by runtime/secret_files.py. Every secret listed must exist,
    # or the pod does not start.
    transcribe:
      secrets:
        - name: database-connection-string
          alias: DATABASE_CONNECTION_STRING
        - name: azure-storage-account-name
          alias: AZURE_STORAGE_ACCOUNT_NAME
        - name: azure-speech-resource-id
          alias: AZURE_SPEECH_RESOURCE_ID
        - name: azure-speech-endpoint
          alias: AZURE_SPEECH_ENDPOINT
        - name: webhook-secret-encryption-key
          alias: WEBHOOK_SECRET_ENCRYPTION_KEY
        # No key: Azure OpenAI is reached with the workload identity.
        - name: azure-openai-endpoint
          alias: AZURE_OPENAI_ENDPOINT
        # The worker's only source: Flux runs it outside the Jenkins template, so it
        # gets no APPLICATIONINSIGHTS_CONNECTION_STRING from values.aat.template.yaml.
        - name: AppInsightsConnectionString
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
        # google-application-credentials-json and gov-notify-api-key are added
        # once they are seeded.

  # AAT uses the Azure Postgres server from infrastructure/; preview turns this on.
  postgresql:
    enabled: false

# Off unless Flux says otherwise: it sets true on one cluster per environment
# (aat-00 in AAT). It decides whether the worker below exists (Chart.yaml).
global:
  activeCronCluster: false

# The background pollers (transcribe_api/worker.py): the dictation blob poller
# that starts transcription of uploads under user-uploads/, and the recording
# batch-job poller. Same image, Key Vault secrets, environment and workload
# identity as the API (the anchors above).
worker:
  image: *image
  # The base image's entrypoint is the interpreter (see Dockerfile).
  args: ['-m', 'transcribe_api.worker']
  environment:
    <<: *environment
    # worker.py starts the pollers itself and never runs the API lifespan, so
    # neither flag is read; set to what this workload does, for the reader.
    RUN_WORKERS: 'true'
    RUN_MIGRATIONS: 'false'
    OTEL_SERVICE_NAME: transcribe-api-worker
    # Required by the settings model. Set per environment in cnp-flux-config
    # (worker.environment), as python.environment is for the API; empty here
    # so the worker still starts before that is in place.
    APP_URL: ''
    AZURE_AD_CLIENT_ID: ''
  keyVaults: *keyVaults
  # Exactly one. The blob poller claims uploads with an unconditional metadata
  # write and, at startup, resets every in-progress upload, so a second copy
  # would transcribe the same audio twice.
  replicas: 1
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  # Up to 20 transcriptions in flight, each downloading and converting audio.
  memoryRequests: '512Mi'
  memoryLimits: '2048Mi'
  cpuRequests: '250m'
  cpuLimits: '2000m'
  # No HTTP server, so no ingress and no HTTP probes. A crashed worker exits
  # and the kubelet restarts it.
  readinessPath: ''
  livenessPath: ''
  startupPath: ''
  postgresql:
    enabled: false
