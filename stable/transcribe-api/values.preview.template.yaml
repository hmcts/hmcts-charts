# The pollers run in the API process instead (RUN_WORKERS below).
worker:
  enabled: false
python:
  image: ${IMAGE_NAME}
  ingressHost: transcribe-api-pr-${CHANGE_ID}.preview.platform.hmcts.net
  # The namespace's workload identity and Key Vault are AAT's. A preview uses
  # neither: every dependency below is its own or a mock.
  useWorkloadIdentity: false
  disableKeyVaults: true
  environment:
    # CNP sets global.environment=aat on PR builds; a preview must say it is one.
    ENVIRONMENT: preview
    # The web preview runs with sign-in off and sends no token, so token-less
    # requests authenticate as a fixed preview user. Refused at startup unless
    # ENVIRONMENT=preview (domain/auth/token_auth.py).
    AUTH_PREVIEW_USER_ENABLED: 'true'
    AUTH_PREVIEW_USER_ROLES: Judge,LegalTextManager,SystemAdministrator,Normal
    AUTH_ACCESS_ROLES: Judge,LegalTextManager,SystemAdministrator,Normal
    APP_URL: https://transcribe-web-pr-${CHANGE_ID}.preview.platform.hmcts.net
    AZURE_AD_CLIENT_ID: 18996d70-494e-4ddb-9ebd-17b4a1077314
    DATABASE_CONNECTION_STRING: postgresql://transcribe:transcribe@{{ .Release.Name }}-postgresql:5432/transcribe
    # Azurite's published development account key, not a secret.
    AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://{{ .Release.Name }}-azurite:10000/devstoreaccount1;
    # Unused while the connection string is set; not a valid account name, so
    # nothing can reach a real account through it.
    AZURE_STORAGE_ACCOUNT_NAME: preview-azurite
    SPEECH_BACKEND: mock
    RUN_WORKERS: 'true'
  # Throwaway in-cluster Postgres per PR.
  postgresql:
    enabled: true
    auth:
      username: transcribe
      password: transcribe
      database: transcribe

azurite:
  enabled: true
