python:
  image: ${IMAGE_NAME}
  ingressHost: transcribe-api-pr-${CHANGE_ID}.preview.platform.hmcts.net
  environment:
    APP_URL: https://transcribe-web-pr-${CHANGE_ID}.preview.platform.hmcts.net
    # Same registration as aat, whose vault preview also uses.
    AZURE_AD_CLIENT_ID: a6407440-40bc-48da-94d6-170febce9384
    APPLICATIONINSIGHTS_CONNECTION_STRING: ${APP_INSIGHTS_CONNECTION_STRING}
  # Per-PR environments get a throwaway in-cluster Postgres rather than a real
  # Azure server, so a preview costs nothing to create and nothing to destroy.
  postgresql:
    enabled: true
    auth:
      username: transcribe
      password: transcribe
      database: transcribe
