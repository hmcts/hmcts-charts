{{- if and .Values.java.postgresql .Values.java.postgresql.enabled }}
  {{- $secretName := printf "%s-db-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- $appPassword := randAlphaNum 32 | b64enc }}
  {{- $adminPassword := randAlphaNum 32 | b64enc }}
  {{- if $existingSecret }}
  {{- $appPassword = required "Existing DB_PASSWORD is missing" (index $existingSecret.data "DB_PASSWORD") }}
  {{- $adminPassword = required "Existing postgres-password is missing" (index $existingSecret.data "postgres-password") }}
  {{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  DB_PASSWORD: {{ $appPassword | quote }}
  postgres-password: {{ $adminPassword | quote }}
  {{- end }}
