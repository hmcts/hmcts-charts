java:
  # Populated by the deployment pipeline.
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}

  keyVaults:
    snl:
      disabled: true
      secrets: []

  environment:
    SNL_TEST_ENDPOINTS_ENABLED: "true"
    DB_HOST: "{{ .Release.Name }}-postgresql"
    DB_PORT: "5432"
    DB_NAME: snl-db
    DB_USER_NAME: snl_app
    DB_OPTIONS: ""

  secrets:
    DB_PASSWORD:
      secretRef: '{{ printf "%s-db-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}'
      key: DB_PASSWORD

  postgresql:
    enabled: true
    image:
      registry: hmctsprod.azurecr.io
      repository: imported/bitnami/postgresql
      tag: "16.6.0"

    auth:
      # Bootstrap as administrator; the app must not own the database.
      username: ""
      password: ""
      postgresPassword: ""
      database: snl-db
      existingSecret: '{{ printf "%s-db-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}'
      secretKeys:
        adminPasswordKey: postgres-password

    primary:
      extraEnvVars:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ printf "%s-db-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}'
              key: DB_PASSWORD

        - name: POSTGRES_INITSCRIPTS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ printf "%s-db-credentials" .Release.Name | trunc 63 | trimSuffix "-" }}'
              key: postgres-password

      persistence:
        enabled: false

      initdb:
        user: postgres
        password: ""
        scriptsConfigMap: '{{ printf "%s-postgres-init" .Release.Name | trunc 63 | trimSuffix "-" }}'
