java:
  applicationPort: 8081
  image: 'hmctsprod.azurecr.io/snl/snl-backend:latest'
  ingressHost: snl-backend.{{ .Values.global.environment }}.platform.hmcts.net
  aadIdentityName: snl
  keyVaults:
    snl:
      secrets:
        - name: app-insights-connection-string
          alias: app-insights-connection-string
        - name: snl-infrastructure-POSTGRES-HOST
          alias: DB_HOST
        - name: snl-infrastructure-POSTGRES-PORT
          alias: DB_PORT
        - name: snl-infrastructure-POSTGRES-DATABASE
          alias: DB_NAME
        - name: snl-infrastructure-POSTGRES-USER
          alias: DB_USER_NAME
        - name: snl-infrastructure-POSTGRES-PASS
          alias: DB_PASSWORD
  environment:
    DB_OPTIONS: "?sslmode=require"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: /opt/app/applicationinsights.json
    APPLICATIONINSIGHTS_ROLE_NAME: snl-backend
