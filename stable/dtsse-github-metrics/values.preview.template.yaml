nodejs:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  memoryRequests: 1Gi
  memoryLimits: 2Gi
  keyVaults:
    dtsse:
      secrets:
        - name: AppInsightsConnectionString
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
  secrets:
    POSTGRES_HOST:
      secretRef: postgres
      key: HOST
    POSTGRES_PORT:
      secretRef: postgres
      key: PORT
    POSTGRES_USER:
      secretRef: postgres
      key: USER
    POSTGRES_PASSWORD:
      secretRef: postgres
      key: PASSWORD
  environment:
    POSTGRES_DATABASE: "{{ .Release.Name }}"
    METRICS_CONFIG: /app/metrics.example.yaml

job:
  enabled: false

# Off for the same reason as `job`: a preview deploys with an empty database and `@smoke` asserts that pages
# render and health is UP, never that any figure is non-zero. A preview that walked 336 teams and 3,277
# repositories would also spend the App's whole hourly quota on a throwaway environment.
orgJob:
  enabled: false

postgresql:
  enabled: true
  flexibleserver: dtsse-preview
  setup:
    databases:
      - name: "{{ .Release.Name }}"
