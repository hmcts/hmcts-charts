nodejs:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  # No memory figures of its own: a preview warms a copy of AAT's database (`src/preview/load-aat.ts`), so it
  # needs what AAT has, and inherits all eight from charts/values.yaml. A 2Gi limit here held a process told to
  # grow its heap to 3072Mi, which is the staging OOM loop described there.
  keyVaults:
    dtsse:
      secrets:
        - name: AppInsightsConnectionString
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
  secrets:
    POSTGRES_HOST:
      secretRef: postgres
      key: HOST
    POSTGRES_PORT:
      secretRef: postgres
      key: PORT
    POSTGRES_USER:
      secretRef: postgres
      key: USER
    POSTGRES_PASSWORD:
      secretRef: postgres
      key: PASSWORD
  environment:
    POSTGRES_DATABASE: "{{ .Release.Name }}"
    AUTH_DISABLED: "true"

# A preview's data is a copy of AAT's, loaded by the pipeline before the smoke tests, and never collected by the
# preview itself: `@smoke` asserts that health is UP, never that any figure is non-zero, and a collector here would
# spend the App's quota on a throwaway environment.
job:
  enabled: false

orgJob:
  enabled: false

# Off, and for a reason beyond quota. These two mount `dtsse-aat` like every other block, which holds the AAT
# database's own `github-metrics-postgres-*` — so a preview's CronJob would run the PR's code against the production
# database rather than the preview's, and `collect-alerts` would write back the secret-scanning locations the copy
# scrubs. Only the job chart's suspension stood between a preview and that.
cveJob:
  enabled: false

alertJob:
  enabled: false

# Off for the same reason, and this one spends the scarcest quota of all: resolving 315 SonarCloud projects is one
# commit search each against 10 a minute, and a preview that did it would leave the weekly run for the real
# deployment with nothing to spend.
sonarJob:
  enabled: false

postgresql:
  enabled: true
  flexibleserver: dtsse-preview
  setup:
    databases:
      - name: "{{ .Release.Name }}"
