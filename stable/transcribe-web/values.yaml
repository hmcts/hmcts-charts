nodejs:
  # Caddy on 3000 proxies to the Next.js server on 3001.
  applicationPort: 3000
  image: 'hmctsprod.azurecr.io/transcribe/web:latest'
  # Public hostname, served through Front Door.
  ingressHost: benchnotes.{{ .Values.global.environment }}.platform.hmcts.net

  # The base chart's /health/liveness and /health/readiness are not served.
  readinessPath: /health
  livenessPath: /health
  startupPath: /health

  environment:
    # Where Caddy and the recording route handlers send /api/* calls: the API's
    # Kubernetes service in this namespace. (The API's internal ingress host has
    # no private DNS record, so it does not resolve.)
    BACKEND_INTERNAL_URL: http://transcribe-api-python
    # This app's own origin, so browser API calls stay same-origin. Written to
    # public/env-config.js at start by start.js.
    NEXT_PUBLIC_API_URL: https://benchnotes.{{ .Values.global.environment }}.platform.hmcts.net
    # The Speech account is private; Caddy proxies the Speech SDK's traffic to it.
    AZURE_SPEECH_ENDPOINT: https://transcribe-speech-{{ .Values.global.environment }}.cognitiveservices.azure.com
    # Login redirect URI is ${APP_URL}/auth/callback.
    APP_URL: https://benchnotes.{{ .Values.global.environment }}.platform.hmcts.net
    AUTH_ENABLED: 'true'
    # Comma-separated app roles; a user must hold at least one to sign in.
    # Backs up "Assignment required" on the app registration. Empty: not
    # checked. Switched on per environment in cnp-flux-config.
    AUTH_ACCESS_ROLES: ''
    # HMCTS tenant (CJS Common Platform); the client ID is per environment
    # (values.<env>.template.yaml): app registrations from hmcts/central-app-registration.
    AZURE_AD_TENANT_ID: 531ff96d-0ae9-462a-8d2d-bec7c0b42082
    # cloud_RoleName in App Insights; unset, it is "unknown_service:node".
    OTEL_SERVICE_NAME: transcribe-web

  keyVaults:
    # Mounted as files and loaded into the environment by start.js. Every
    # secret listed must exist, or the pod does not start.
    transcribe:
      secrets:
        - name: entra-client-secret
          alias: AZURE_AD_CLIENT_SECRET
        - name: web-redis-connection-string
          alias: REDIS_URL
        # instrumentation.ts starts Azure Monitor only when this is set.
        # Created by transcribe-shared-infrastructure (application-insights.tf).
        - name: AppInsightsConnectionString
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
