nodejs:
  applicationPort: 3344
  replicas: 1
  cpuLimits: 500m
  cpuRequests: 100m
  memoryRequests: 512Mi
  memoryLimits: 1024Mi
  # Autoscaling must be off for `replicas: 1` to hold: an HPA owns the replica count, so
  # with minReplicas 2 it would scale straight back up and the setting above would be
  # silently ignored.
  autoscaling:
    enabled: false
  image: 'hmctsprod.azurecr.io/apim/marketplace-web:latest'
  ingressHost: apim-marketplace-web.{{ .Values.global.environment }}.platform.hmcts.net
  # AMP-1031: App Insights is stubbed for initial onboarding — there is no
  # azurerm_application_insights resource for the apim product yet, and the
  # apim-{env} vault holds only the marketplace-POSTGRES-* secrets. Add
  # aadIdentityName + keyVaults here once a connection string exists in the vault
  # AND the managed identity has Key Vault Secrets User on it.
  environment:
    APPLICATIONINSIGHTS_ENABLED: 'false'
    # In-cluster address of service-api-marketplace (release apim-marketplace, type java).
    API_URL: http://apim-marketplace-java
