java:
  replicas: 1
  applicationPort: 8080
  image: 'hmctsprod.azurecr.io/amp/marketplace:latest'
  ingressHost: amp-marketplace-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
  aadIdentityName: amp
  environment:
    APPLICATIONINSIGHTS_ENABLED: "false"
    APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=00000000-0000-0000-0000-000000000000"
