nodejs:
  applicationPort: 3344
  replicas: 1
  cpuLimits: 500m
  cpuRequests: 100m
  memoryRequests: 512Mi
  memoryLimits: 1024Mi
  # Autoscaling must be off for `replicas: 1` to hold: an HPA owns the replica count, so
  # with minReplicas 2 it would scale straight back up and the setting above would be
  # silently ignored.
  autoscaling:
    enabled: false
  image: 'hmctsprod.azurecr.io/amp/marketplace-web:latest'
  ingressHost: amp-marketplace-web.{{ .Values.global.environment }}.platform.hmcts.net
  # AMP-1031: App Insights is stubbed for initial onboarding — there is no
  # azurerm_application_insights resource for the amp product yet, and the
  # amp-{env} vault holds only the marketplace-POSTGRES-* secrets. Add
  # aadIdentityName + keyVaults here once a connection string exists in the vault
  # AND the managed identity has Key Vault Secrets User on it.
  environment:
    APPLICATIONINSIGHTS_ENABLED: 'false'
    # In-cluster address of service-api-marketplace (release amp-marketplace, type java).
    API_URL: http://amp-marketplace-java
    # aat and demo have no Entra tenant, and the app refuses to start without one.
    ENTRA_ENABLED: '{{ if has .Values.global.environment (list `aat` `demo`) }}false{{ else }}true{{ end }}'
    # Both must be registered on the web-api-marketplace app registration exactly as written.
    ENTRA_REDIRECT_URI: https://amp-marketplace-web.{{ .Values.global.environment }}.platform.hmcts.net/auth/callback
    ENTRA_POST_LOGOUT_REDIRECT_URI: https://amp-marketplace-web.{{ .Values.global.environment }}.platform.hmcts.net/
    # Picks this environment's API addresses (apiEndpoints in config/default.json) for the
    # instructions on an application's page. One with no address there leaves them out.
    PLATFORM_ENVIRONMENT: '{{ .Values.global.environment }}'
