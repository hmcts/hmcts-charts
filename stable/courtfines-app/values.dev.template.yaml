nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    ALLOW_CONFIG_MUTATIONS: true
    TESTVAR: 'Devtestvalue'
    LOG_LEVEL: 'DEBUG'
    NODE_ENV: 'dev'
    COURTFINES_PR_DATABASE: 'true'
    COURTFINES_PR_NUMBER: '${CHANGE_ID}'
    COURTFINES_DB_NAME: 'pr-${CHANGE_ID}-courtfines'
  secrets:
    COURTFINES_DB_PASSWORD:
      secretRef: 'postgres'
      key: PASSWORD
      disabled: false

postgresql:
  enabled: true
  flexibleserver: courtfines-dev
  setup:
    databases:
      - name: 'pr-${CHANGE_ID}-courtfines'
